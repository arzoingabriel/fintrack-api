name: CI - FinTrack API

on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # Un nouveau push annule le run en cours sur la même branche

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm" # NOUVEAU : cache des paquets npm
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Tests unitaires - Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        node: [20, 22, 24] # NOUVEAU : 3 jobs, un par version
      fail-fast: false # Laisser finir les autres versions si l'une échoue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      - name: Tests unitaires avec couverture
        run: npm test
      - name: Conserver le rapport de couverture
        if: matrix.node == 22 # Un seul rapport suffit
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  integration-tests:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev # Seulement les dépendances de production
      - run: npm run build

      - name: Lire la version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Créer l'archive
        run: tar -czf fintrack-api-${{ steps.version.outputs.value }}.tar.gz src package.json package-lock.json

      - name: Conserver l'archive
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-api-${{ steps.version.outputs.value }}
          path: fintrack-api-*.tar.gz
          retention-days: 30

      - name: Résumé
        run: |
          echo "## CI FinTrack API" >> $GITHUB_STEP_SUMMARY
          echo "Version **${{ steps.version.outputs.value }}** : lint, tests (Node 20, 22, 24) et build OK" >> $GITHUB_STEP_SUMMARY

  ci-status:
    name: Statut CI
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, build]
    if: always() # Tourne même si un job précédent a échoué
    steps:
      - name: Un job a échoué ou a été annulé
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Tous les checks CI sont au vert"